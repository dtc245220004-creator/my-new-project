<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu dọc Dropdown</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      padding: 40px;
    }

    h1 {
      margin-bottom: 25px;
      color: #222;
    }

    #menu ul {
      list-style: none;
    }

    #menu > ul > li,
    #menu ul li {
      list-style: none;
      position: relative;
      width: 160px;
      min-height: 40px;
      padding: 0 20px;
      background-color: #000;
      line-height: 40px;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }

    #menu ul li a {
      display: block;
      text-decoration: none;
      color: #fff;
    }

    #menu ul li:hover {
      background-color: #444;
    }

    #menu ul li ul {
      position: absolute;
      top: 0;
      left: 160px;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 10;
    }

    #menu ul li:hover > ul {
      visibility: visible;
      opacity: 1;
    }

    #menu ul li ul li {
      width: 180px;
    }

    .note {
      margin-top: 30px;
      color: #555;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>Menu dọc Dropdown</h1>

  <div id="menu">
    <ul>
      <li><a href="#">Trang chủ</a></li>
      <li>
        <a href="#">Sản phẩm ▸</a>
        <ul>
          <li><a href="#">Điện thoại</a></li>
          <li><a href="#">Laptop</a></li>
          <li><a href="#">Phụ kiện</a></li>
        </ul>
      </li>
      <li>
        <a href="#">Dịch vụ ▸</a>
        <ul>
          <li><a href="#">Thiết kế web</a></li>
          <li><a href="#">Lập trình</a></li>
          <li><a href="#">Bảo trì</a></li>
        </ul>
      </li>
      <li><a href="#">Tin tức</a></li>
      <li><a href="#">Liên hệ</a></li>
    </ul>
  </div>

  <p class="note">Di chuột vào mục “Sản phẩm” hoặc “Dịch vụ” để hiển thị menu con.</p>
</body>
</html>
