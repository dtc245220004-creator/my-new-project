<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid-gap Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành CSS | grid-gap Property</h1>

    <section class="example">
        <h2>Ví dụ 1: Khoảng cách hàng và cột bằng nhau</h2>
        <p><code>grid-gap: 20px;</code></p>
        <div class="grid-container example-1">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </section>

    <section class="example">
        <h2>Ví dụ 2: Khoảng cách hàng và cột khác nhau</h2>
        <p><code>grid-gap: 30px 10px;</code></p>
        <div class="grid-container example-2">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </section>
</body>
</html>
