<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng ký người dùng</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }
        .form-card {
            width: min(92%, 520px);
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        h1 {
            margin-top: 0;
            text-align: center;
            color: #1f4e78;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #c9d2dc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #2b6cb0;
            box-shadow: 0 0 0 3px rgba(43,108,176,0.12);
        }
        .gender-options {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }
        .gender-options label {
            font-weight: normal;
            margin: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #2b6cb0;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #1f4e78; }
        .note {
            margin-top: 14px;
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="form-card">
        <h1>Đăng ký người dùng</h1>

        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            <div class="form-group">
                <label for="name">Họ và tên</label>
                <input type="text" id="name" name="name" placeholder="Nhập họ và tên" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Nhập email" required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required>
            </div>

            <div class="form-group">
                <label>Giới tính</label>
                <div class="gender-options">
                    <label><input type="radio" name="gender" value="male" required> Nam</label>
                    <label><input type="radio" name="gender" value="female"> Nữ</label>
                    <label><input type="radio" name="gender" value="other"> Khác</label>
                </div>
            </div>

            <button type="submit">Đăng ký</button>
        </form>

        <p class="note">Form sử dụng đúng phương thức POST, action của máy chủ mẫu CodeGym và các trường name, email, phone, gender theo yêu cầu bài tập.</p>
    </main>
</body>
</html>
