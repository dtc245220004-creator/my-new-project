<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">MyWebsite</div>

        <ul class="nav-links">
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>

        <button class="menu-icon" type="button" aria-label="Mở menu" aria-expanded="false">☰</button>
    </nav>

    <main class="hero">
        <h1>Thanh điều hướng Responsive</h1>
        <p>Thu nhỏ cửa sổ trình duyệt xuống dưới 768px để kiểm tra menu trên thiết bị di động.</p>
    </main>
</body>
</html>
