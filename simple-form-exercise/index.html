<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập tạo form đơn giản</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
        }
        .container {
            width: min(1000px, 92%);
            margin: 35px auto;
        }
        h1 {
            text-align: center;
            color: #1f4e78;
            margin-bottom: 30px;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: 0 6px 18px rgba(0,0,0,.08);
        }
        h2 {
            margin-top: 0;
            color: #2b5797;
            border-bottom: 2px solid #e3edf7;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label.title {
            display: block;
            font-weight: 700;
            margin-bottom: 7px;
        }
        input[type="text"],
        input[type="email"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #c9d3df;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #2b5797;
            box-shadow: 0 0 0 3px rgba(43,87,151,.12);
        }
        textarea {
            min-height: 90px;
            resize: vertical;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
        }
        .options label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button, input[type="submit"], input[type="reset"] {
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
        }
        input[type="submit"] {
            background: #2b5797;
            color: #fff;
        }
        input[type="reset"] {
            background: #e9eef5;
            color: #222;
        }
        .required { color: #d93025; }
        @media (max-width: 600px) {
            .card { padding: 20px; }
            .actions { flex-direction: column; }
            input[type="submit"], input[type="reset"] { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Bài tập tạo form đơn giản</h1>

        <section class="card">
            <h2>Phần 1: Form thông tin cá nhân</h2>
            <form action="#" method="get">
                <div class="form-group">
                    <label class="title" for="yourname">Họ và tên</label>
                    <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên">
                </div>

                <div class="form-group">
                    <label class="title" for="email1">Email</label>
                    <input type="email" id="email1" name="email" placeholder="Nhập email">
                </div>

                <div class="form-group">
                    <label class="title">Sở thích</label>
                    <div class="options">
                        <label><input type="checkbox" name="hobby" value="the-thao"> Thể thao</label>
                        <label><input type="checkbox" name="hobby" value="am-nhac"> Âm nhạc</label>
                        <label><input type="checkbox" name="hobby" value="doc-sach"> Đọc sách</label>
                        <label><input type="checkbox" name="hobby" value="du-lich"> Du lịch</label>
                        <label><input type="checkbox" name="hobby" value="choi-game"> Chơi game</label>
                    </div>
                </div>

                <div class="actions">
                    <input type="submit" value="Gửi thông tin">
                    <input type="reset" value="Nhập lại">
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Phần 2: Form đăng ký học viên</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label class="title" for="fullname">Họ và tên <span class="required">*</span></label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Nhập họ và tên">
                </div>

                <div class="form-group">
                    <label class="title" for="email2">Email <span class="required">*</span></label>
                    <input type="email" id="email2" name="email" required placeholder="Nhập email">
                </div>

                <div class="form-group">
                    <label class="title" for="phone">Số điện thoại</label>
                    <input type="text" id="phone" name="phone" placeholder="Nhập số điện thoại">
                </div>

                <div class="form-group">
                    <label class="title" for="birthday">Ngày sinh</label>
                    <input type="date" id="birthday" name="birthday">
                </div>

                <div class="form-group">
                    <label class="title">Giới tính</label>
                    <div class="options">
                        <label><input type="radio" name="gender" value="nam"> Nam</label>
                        <label><input type="radio" name="gender" value="nu"> Nữ</label>
                        <label><input type="radio" name="gender" value="khac"> Khác</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="title" for="address">Địa chỉ</label>
                    <textarea id="address" name="address" placeholder="Nhập địa chỉ"></textarea>
                </div>

                <div class="form-group">
                    <label class="title" for="course">Khóa học</label>
                    <select id="course" name="course">
                        <option value="html-css">HTML &amp; CSS</option>
                        <option value="javascript">JavaScript</option>
                        <option value="java">Java</option>
                        <option value="python">Python</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="title">Hình thức học</label>
                    <div class="options">
                        <label><input type="radio" name="study_type" value="online"> Online</label>
                        <label><input type="radio" name="study_type" value="offline"> Offline</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="title">Sở thích</label>
                    <div class="options">
                        <label><input type="checkbox" name="hobby" value="lap-trinh"> Lập trình</label>
                        <label><input type="checkbox" name="hobby" value="doc-sach"> Đọc sách</label>
                        <label><input type="checkbox" name="hobby" value="am-nhac"> Âm nhạc</label>
                        <label><input type="checkbox" name="hobby" value="the-thao"> Thể thao</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="title" for="note">Ghi chú</label>
                    <textarea id="note" name="note" placeholder="Nhập ghi chú nếu có"></textarea>
                </div>

                <div class="actions">
                    <input type="submit" value="Đăng ký">
                    <input type="reset" value="Nhập lại">
                </div>
            </form>
        </section>
    </main>
</body>
</html>
