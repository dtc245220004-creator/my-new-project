<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu ngang Dropdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        #menu {
            height: 50px;
            background: #222;
            border: 1px solid #111;
            width: fit-content;
        }

        #menu ul {
            list-style: none;
        }

        #menu > ul > li {
            float: left;
            position: relative;
        }

        #menu li a {
            display: block;
            width: 140px;
            height: 50px;
            line-height: 50px;
            text-align: center;
            text-decoration: none;
            color: white;
            background: #222;
            transition: background-color 0.2s ease;
        }

        #menu li a:hover {
            background: red;
        }

        #menu ul ul {
            position: absolute;
            top: 50px;
            left: 0;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #menu ul ul li {
            position: relative;
        }

        #menu li:hover > ul {
            visibility: visible;
            opacity: 1;
        }

        .content {
            clear: both;
            padding-top: 40px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Phụ kiện</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Thiết kế web</a></li>
                    <li><a href="#">Bảo trì</a></li>
                    <li><a href="#">Tư vấn</a></li>
                </ul>
            </li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

    <div class="content">
        <h1>Menu ngang Dropdown</h1>
        <p>Di chuột vào mục “Sản phẩm” hoặc “Dịch vụ” để hiển thị menu con.</p>
    </div>
</body>
</html>
