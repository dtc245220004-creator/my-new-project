<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #bbb;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #e9eef5;
        }

        tbody tr:nth-child(even) {
            background: #f9fbfd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Danh sách sản phẩm</h1>
        <table>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
            <tr>
                <td>Áo thun</td>
                <td>150.000 VNĐ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Quần jeans</td>
                <td>350.000 VNĐ</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Giày thể thao</td>
                <td>650.000 VNĐ</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Balo</td>
                <td>250.000 VNĐ</td>
                <td>12</td>
            </tr>
        </table>
    </div>
</body>
</html>
