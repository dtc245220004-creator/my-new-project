<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #f5f7fb;
        }

        .wufoo {
            font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
            max-width: 620px;
            margin: 0 auto;
            background: #ffffff;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        p {
            margin: 18px 0 8px;
            color: #222;
        }

        select,
        input[type="text"] {
            padding: 8px 10px;
            border: 1px solid #bfc7d1;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }

        select {
            min-width: 180px;
        }

        .radio-group label {
            display: inline-block;
            margin-bottom: 6px;
        }

        .name-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .phone-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        input[type="submit"] {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }

        input[type="submit"]:hover {
            background: #1d4ed8;
        }

        .required {
            color: red;
        }
    </style>
</head>
<body>
    <form method="get" action="simpleform.html" class="wufoo">
        <h2>Order Form</h2>

        <p>What would you like to buy?</p>
        <select name="product">
            <option value="A">A</option>
            <option value="B">B (+ 0.5$)</option>
            <option value="C">C (+ 0.5$)</option>
        </select>

        <p>How many would you like to order?</p>
        <div class="radio-group">
            <label><input type="radio" name="rd" value="1"> 1 - $10</label><br>
            <label><input type="radio" name="rd" value="2"> 2 - $20</label><br>
            <label><input type="radio" name="rd" value="3"> 3 - $25</label>
        </div>

        <p>Name <span class="required">*</span></p>
        <div class="name-row">
            <input type="text" name="firstname" placeholder="FirstName" size="15" required>
            <input type="text" name="lastname" placeholder="LastName" size="15" required>
        </div>

        <p>Email</p>
        <input type="text" name="email" size="35">

        <p>Phone Number</p>
        <div class="phone-row">
            <input type="text" name="phone1" size="5" maxlength="4"> -
            <input type="text" name="phone2" size="5" maxlength="4"> -
            <input type="text" name="phone3" size="5" maxlength="4">
        </div>

        <p><input type="submit" name="btSubmit" value="Submit"></p>
    </form>
</body>
</html>
