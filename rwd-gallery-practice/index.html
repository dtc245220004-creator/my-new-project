<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <h1>Responsive Image Gallery</h1>
        <p class="subtitle">Thay đổi kích thước cửa sổ trình duyệt để xem hiệu ứng responsive.</p>

        <section class="gallery">
            <article class="gallery-item">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Phong cảnh thiên nhiên">
                <p>Phong cảnh thiên nhiên</p>
            </article>

            <article class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Khu rừng xanh">
                <p>Khu rừng xanh</p>
            </article>

            <article class="gallery-item">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Núi và hồ nước">
                <p>Núi và hồ nước</p>
            </article>

            <article class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Cảnh hồ trên núi">
                <p>Cảnh hồ trên núi</p>
            </article>
        </section>

        <p class="note">
            Trên màn hình lớn hơn 700px hiển thị 4 ảnh trên một dòng; nhỏ hơn 700px hiển thị 2 ảnh; nhỏ hơn 500px hiển thị 1 ảnh trên một dòng.
        </p>
    </main>
</body>
</html>
